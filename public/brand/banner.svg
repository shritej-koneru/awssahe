<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#000000" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#581c87" stop-opacity="0.4" />
    </linearGradient>

    <radialGradient id="purpleRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#000000" />
  <rect width="1200" height="630" fill="url(#heroGradient)" />
  <circle cx="600" cy="315" r="450" fill="url(#purpleRadial)" />

  <!-- Grid Accents -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
  </g>

  <!-- Neo-Brutalist Frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="16 12" opacity="0.6" />

  <!-- Header Chip Tag -->
  <g transform="translate(80, 80)">
    <rect x="10" y="10" width="340" height="48" fill="#ffffff" />
    <rect x="0" y="0" width="340" height="48" fill="#a855f7" stroke="#ffffff" stroke-width="3" />
    <text x="24" y="31" font-family="'Oswald', sans-serif" font-size="20" font-weight="700" fill="#000000" letter-spacing="4">
      // AWS STUDENT BUILDERS GROUP
    </text>
  </g>

  <!-- Big Hero Title: BUILD BEYOND -->
  <g transform="translate(80, 290)">
    <!-- BUILD Text -->
    <text x="0" y="0" font-family="'Oswald', 'Bebas Neue', sans-serif" font-size="120" font-weight="900" fill="#ffffff" letter-spacing="2">
      BUILD
    </text>

    <!-- Cross Slash Box -->
    <g transform="translate(380, -95)">
      <rect x="5" y="5" width="70" height="70" fill="#a855f7" />
      <rect x="0" y="0" width="70" height="70" fill="#000000" stroke="#a855f7" stroke-width="3" />
      <path d="M 20 50 L 50 20 M 20 20 L 50 50" stroke="#a855f7" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- BEYOND Text -->
    <text x="470" y="0" font-family="'Oswald', 'Bebas Neue', sans-serif" font-size="120" font-weight="900" fill="#a855f7" letter-spacing="2">
      BEYOND
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="80" y="375" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="500" fill="#d1d5db" letter-spacing="3">
    EMPOWERING PEERS TO BUILD, DEPLOY AND SCALE THE FUTURE WITH AWS.
  </text>

  <!-- Footer Info Line -->
  <g transform="translate(80, 510)">
    <!-- Diamond Bullet -->
    <rect x="0" y="0" width="14" height="14" fill="#a855f7" transform="rotate(45 7 7)" />
    <text x="28" y="14" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="600" fill="#ffffff" letter-spacing="2">
      SIDDHARTHA ACADEMY OF HIGHER EDUCATION, VIJAYAWADA
    </text>
  </g>
</svg>
