<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <linearGradient id="badgePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="300" height="300" rx="32" fill="#000000" />
  
  <!-- Brutalist Offset Box -->
  <rect x="25" y="25" width="250" height="250" rx="20" fill="#a855f7" />
  <rect x="15" y="15" width="250" height="250" rx="20" fill="#0b0b0b" stroke="#ffffff" stroke-width="5" />

  <!-- Geometric Diamond Glow Frame -->
  <rect x="150" y="70" width="80" height="80" fill="none" stroke="url(#badgePurple)" stroke-width="5" transform="rotate(45 150 70)" opacity="0.9" />

  <!-- Code Slash & Terminal Motif -->
  <path d="M 95 195 L 205 105" stroke="#ffffff" stroke-width="12" stroke-linecap="round" />

  <!-- AWS Accent Dots -->
  <circle cx="95" cy="105" r="10" fill="#a855f7" />
  <circle cx="205" cy="195" r="10" fill="#a855f7" />

  <!-- AWS Monogram Subtext -->
  <text x="150" y="240" font-family="'Oswald', 'Bebas Neue', sans-serif" font-size="32" font-weight="800" fill="#a855f7" text-anchor="middle" letter-spacing="4">
    AWS SAHE
  </text>
</svg>
